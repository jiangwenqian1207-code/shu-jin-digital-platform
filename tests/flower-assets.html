<!doctype html><meta charset="utf-8"><title>Flower asset reference</title><style>body{background:#222;color:white;font:14px sans-serif}section{display:flex}figure{width:180px;margin:10px}img{width:170px;height:160px;object-fit:contain;background:#dedbd3}figcaption{overflow-wrap:anywhere}</style><main></main><script type="module">const files={orchid:['cross-floral','fangfang-brocade'],narcissus:['cross-floral','persimmon-calyx'],chrysanthemum:['diamond','small-cross-floral-deer','small-cross-floral-magpie'],hibiscus:['fangfang-brocade','small-cross-floral-deer','small-cross-floral-magpie'],'plum-blossom':['yellow-ground-deer']};for(const [id,names] of Object.entries(files)){const s=document.createElement('section');s.innerHTML=`<h2>${id}</h2>`+names.map(n=>`<figure><img src="../public/digital-artworks/digital-flowers/${id}/patterns/${id}-${n}-pattern.svg"><figcaption>${n}</figcaption></figure>`).join('');document.querySelector('main').append(s);}</script>
